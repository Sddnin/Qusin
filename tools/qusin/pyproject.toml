[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qusin-phone-cli"
version = "0.1.0"
description = "Command-line client for Qusin's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
qusin = "qusin_cli:main"

[tool.setuptools]
py-modules = ["qusin_cli", "qusin_notifications"]
packages = ["qusin_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
qusin_desk = ["*.html", "*.css", "*.js", "qusin-logo.png"]
