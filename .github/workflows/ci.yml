name: CI

# CI：单元测试、Android 打包、CLI 契约和网关集成；main 上全部检查通过后自动创建尚不存在的版本 Release。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 推新提交时取消上一次还没跑完的，main 上的推送各自跑完。
# 推送和手动触发按 run_id 各占一组，不会被后来的运行取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # 默认缓存策略：默认分支可写，其他分支（含 PR）只读。
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      # 测试挂了,把每个失败用例的「期望 / 实际」差异摘出来贴到本次运行的 Summary 页,手机上不用下载压缩包就能看。
      # ComparisonFailure 的消息本身就是只留差异那一段的紧凑形式。
      - name: Show failed test diffs
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, re, xml.etree.ElementTree as ET
          out = os.environ["GITHUB_STEP_SUMMARY"]
          rows = []
          for f in sorted(glob.glob("core/build/test-results/test/TEST-*.xml")):
              for case in ET.parse(f).getroot().iter("testcase"):
                  fail = case.find("failure")
                  if fail is None:
                      fail = case.find("error")
                  if fail is not None:
                      msg = (fail.get("message") or fail.text or "").strip()
                      rows.append((case.get("classname", "").rsplit(".", 1)[-1], case.get("name", ""), msg))
          with open(out, "a", encoding="utf-8") as o:
              o.write(f"## {len(rows)} failed test(s) in core\n\n")
              for cls, name, msg in rows[:40]:
                  # ComparisonFailure: "...expected:<A> but was:<B>"。A 很长时 B 会被整体截掉,所以两边各取开头一段:
                  # 紧凑形式里开头就是第一处不同,A、B 各看 700 字就能对出改了什么。
                  m = re.search(r"^(.*?)expected:<(.*)> but was:<(.*)>\s*$", msg, re.S)
                  if m:
                      head, a, b = m.groups()
                      cut = lambda t: t if len(t) <= 700 else t[:700] + " …(cut)"
                      short = f"{head.strip()}\n\n--- expected (snapshot) ---\n{cut(a)}\n\n--- but was (current code) ---\n{cut(b)}"
                  else:
                      short = msg if len(msg) <= 1500 else msg[:1500] + " …(cut)"
                  o.write(f"### {cls} > {name}\n\n~~~\n{short}\n~~~\n\n")
              if len(rows) > 40:
                  o.write(f"…and {len(rows) - 40} more\n")
          print(f"wrote {len(rows)} failures to the summary")
          PY
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: cli (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # cliTest 先跑 cliContractTest（经真实子进程调 Python CLI），再跑 tools/qusin/tests 下的 unittest。
      - name: CLI tests
        run: ./gradlew :core:cliTest -PqusinPython=python3 --stacktrace
      - name: Translation tool tests
        run: python3 -m unittest discover -s tools/i18n -v
      - name: Translation resource checks
        run: python3 tools/i18n/translations.py check
      - name: Log export tool tests
        run: python3 -m unittest discover -s tools -p 'test_pull_logs.py' -v
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-results
          path: |
            core/build/test-results/cliContractTest
            core/build/reports/tests/cliContractTest
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36；构建工具版本取 AGP 8.7.3 的默认值。action 顺带接受 SDK 许可。
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # PR 不暴露签名密钥；push/main 和手动运行才从 Actions Secrets 解码持久化 keystore。
      - name: Decode and validate release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/qusin-release.keystore"
          # Accept a one-line secret or a pasted value containing line breaks/spaces.
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Recreate it from the original release keystore (Linux: base64 -w0 release.jks)."
            exit 1
          fi
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty"; exit 1; }

          # JKS starts with FEEDFEED; PKCS12 is an ASN.1 SEQUENCE (30...).
          magic=$(od -An -tx1 -N4 "$KEYSTORE_PATH" | tr -d '[:space:]')
          case "$magic" in
            feedfeed) KEYSTORE_TYPE=JKS ;;
            30*) KEYSTORE_TYPE=PKCS12 ;;
            *)
              echo "::error::Decoded keystore has an unknown file signature ($magic). The secret may be truncated, double-base64-encoded, or from the wrong file."
              exit 1
              ;;
          esac

          if ! keytool -list -keystore "$KEYSTORE_PATH" -storetype "$KEYSTORE_TYPE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              > "$RUNNER_TEMP/keystore-check.txt" 2>&1; then
            if grep -Eqi 'EOFException|lengthTag.*too big|DerInputStream' "$RUNNER_TEMP/keystore-check.txt"; then
              echo "::error::Decoded keystore is truncated or corrupt (keytool could not read its structure). Recreate ANDROID_KEYSTORE_BASE64 from the ORIGINAL release keystore; do not create a new signing key."
            else
              echo "::error::Keystore validation failed. Check the original ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
            fi
            cat "$RUNNER_TEMP/keystore-check.txt"
            exit 1
          fi

          # Read the private key too, so a wrong key password fails before Gradle packaging.
          if ! keytool -certreq -keystore "$KEYSTORE_PATH" -storetype "$KEYSTORE_TYPE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              -keypass "$ANDROID_KEY_PASSWORD" -file "$RUNNER_TEMP/keystore-check.csr" \
              > "$RUNNER_TEMP/key-check.txt" 2>&1; then
            echo "::error::Private-key validation failed. Check ANDROID_KEY_PASSWORD for the selected alias."
            cat "$RUNNER_TEMP/key-check.txt"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/keystore-check.csr"
          echo "Validated $KEYSTORE_TYPE keystore, alias, and private-key password (details withheld)."
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_TYPE=$KEYSTORE_TYPE"
          } >> "$GITHUB_ENV"
      # assembleDebug 验证单测碰不到的打包路径：31MB 的 rootfs、jniLibs 旧式解压、AIDL、Compose。
      # 编译设备测试以检查设置交互等回归用例；这里没有连接设备，不执行 instrumentation。
      # BundledRuntimeTest 读的是检出后的 rootfs.tar.xz；先把它的大小、哈希、文件头和代码里的常量并排打出来，
      # 检出把它改坏（换行转换、LFS 指针、没推全）时，日志里一眼就能看到，不用等单测报 XZFormatException。
      # 提交里的 rootfs.tar.xz 若是 LFS 指针(133 字节的文本):直接问 GitHub 的 LFS 接口要这个对象。
      # 要得到就下载、核对哈希、换掉指针;要不到(对象没传上来、没权限)就把服务端的回答原样打出来,不报错,
      # 下一步照常把原因打出来。提交了真文件时这一步什么都不做。
      - name: Fetch bundled runtime from LFS if the commit has a pointer
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          f=app/src/main/assets/runtime/rootfs.tar.xz
          if [ "$(stat -c %s "$f")" -ge 1024 ] || ! head -c 7 "$f" | grep -q '^version'; then
            echo "not a pointer, nothing to fetch"
            exit 0
          fi
          oid=$(sed -n 's/^oid sha256://p' "$f")
          size=$(sed -n 's/^size //p' "$f")
          echo "pointer: oid=$oid size=$size"
          curl -sS -u "x-access-token:$GITHUB_TOKEN" \
            -H "Accept: application/vnd.git-lfs+json" -H "Content-Type: application/vnd.git-lfs+json" \
            -X POST "https://github.com/$GITHUB_REPOSITORY.git/info/lfs/objects/batch" \
            -d "{\"operation\":\"download\",\"transfers\":[\"basic\"],\"objects\":[{\"oid\":\"$oid\",\"size\":$size}]}" \
            -o "$RUNNER_TEMP/batch.json"
          href=$(jq -r '.objects[0].actions.download.href // empty' "$RUNNER_TEMP/batch.json")
          if [ -z "$href" ]; then
            echo "::error::GitHub LFS has no downloadable object for $oid. Server answer:"
            cat "$RUNNER_TEMP/batch.json"; echo
            exit 1
          fi
          mapfile -t hdrs < <(jq -r '.objects[0].actions.download.header // {} | to_entries[] | "-H", "\(.key): \(.value)"' "$RUNNER_TEMP/batch.json")
          curl -sSL --fail "${hdrs[@]}" -o "$RUNNER_TEMP/rootfs.tar.xz" "$href"
          got=$(sha256sum "$RUNNER_TEMP/rootfs.tar.xz" | cut -d' ' -f1)
          test "$got" = "$oid" || { echo "::error::downloaded object has sha256 $got, expected $oid"; exit 1; }
          mv "$RUNNER_TEMP/rootfs.tar.xz" "$f"
          ls -l "$f"
      # continue-on-error:这一步只负责把原因打出来,不挡住后面的单测(其它测试的结果照常要看)。
      - name: Check bundled runtime asset
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          f=app/src/main/assets/runtime/rootfs.tar.xz
          c=app/src/main/java/com/wangzan101/qusin/cap/sandbox/BundledRuntime.kt
          want_bytes=$(sed -n 's/.*const val BYTES = \([0-9]*\)L.*/\1/p' "$c")
          want_sha=$(sed -n 's/.*const val SHA256 = "\([0-9a-f]*\)".*/\1/p' "$c")
          got_bytes=$(stat -c %s "$f")
          got_sha=$(sha256sum "$f" | cut -d' ' -f1)
          echo "bytes: got=$got_bytes want=$want_bytes"
          echo "sha256: got=$got_sha"
          echo "sha256: want=$want_sha"
          echo "magic: $(head -c 6 "$f" | xxd -p) (xz = fd377a585a00)"
          if [ "$got_bytes" -lt 1024 ] && head -c 7 "$f" | grep -q '^version'; then
            echo "::error::$f is a Git LFS pointer, not the real runtime. Commit the real file (no LFS filter), or set lfs: true on checkout."
            cat "$f"
          fi
          git ls-files --eol "$f" || true
          xz -t "$f"
          test "$got_bytes" = "$want_bytes" && test "$got_sha" = "$want_sha"
      - name: Unit tests, debug build, and device test compilation
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Prepare Qusin APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/qusin-apk
          apk_name="Qusin-debug-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/qusin-apk/${apk_name}"
          (cd dist/qusin-apk && sha256sum *.apk > SHA256SUMS.txt)
          {
            printf '%s\n' '## Qusin debug APK'
            printf '%s\n' 'Main-branch builds are also published as a direct download: https://github.com/Sddnin/Qusin/releases/download/nightly/Qusin.apk'
            printf '%s\n' 'Pull request builds remain available as the Qusin-debug-APK Actions artifact.'
            printf '%s\n' 'This is a debug-signed APK, not a Play Store release build.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Qusin APK
        uses: actions/upload-artifact@v7
        with:
          name: Qusin-debug-APK
          path: dist/qusin-apk/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

  publish-apk:
    name: Publish direct APK download
    runs-on: ubuntu-latest
    needs: app
    # Publish even when the independent JVM job fails, provided the Android build itself passed.
    if: always() && needs.app.result == 'success' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: qusin-nightly-apk-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Download the APK built by the app job
        uses: actions/download-artifact@v8
        with:
          name: Qusin-debug-APK
          path: dist/qusin-apk
      - name: Prepare stable direct-download files
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist/qusin-apk -maxdepth 1 -type f -name 'Qusin-debug-*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" dist/qusin-apk/Qusin.apk
          (cd dist/qusin-apk && sha256sum Qusin.apk > SHA256SUMS.txt)
      - name: Create or update the nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            git tag -f nightly "$GITHUB_SHA"
            git push --force origin refs/tags/nightly
          else
            gh release create nightly \
              --target "$GITHUB_SHA" \
              --title "Qusin Nightly" \
              --notes "Latest Android debug APK built from main. Debug-signed; not a Play Store release." \
              --prerelease
          fi
          gh release upload nightly dist/qusin-apk/Qusin.apk dist/qusin-apk/SHA256SUMS.txt --clobber
      - name: Publish the direct download link
        run: |
          {
            echo "## Direct APK download"
            echo "[Download Qusin.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/Qusin.apk)"
            echo
            echo "Debug-signed build; not a Play Store release."
          } >> "$GITHUB_STEP_SUMMARY"


  publish-release:
    name: Publish versioned GitHub Release
    runs-on: ubuntu-latest
    needs: [core, cli, app, relay]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: qusin-versioned-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Download the APK built by the app job
        uses: actions/download-artifact@v8
        with:
          name: Qusin-debug-APK
          path: dist/release
      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$version"
          apk=$(find dist/release -maxdepth 1 -type f -name 'Qusin-debug-*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" "dist/release/Qusin-v$version.apk"
          (cd dist/release && sha256sum "Qusin-v$version.apk" > SHA256SUMS.txt)
      - name: Create a versioned GitHub Release once per version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate created."
            exit 0
          fi
          gh release create "$tag" \
            "dist/release/Qusin-v$version.apk" \
            dist/release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Qusin $version" \
            --notes-file "docs/releases/$tag.md"
      - name: Publish release links
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          {
            echo "## Qusin $version"
            echo "[GitHub Release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$version)"
            echo "[Download APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/v$version/Qusin-v$version.apk)"
            echo
            echo "The GitHub APK is debug-signed; it is not a Play Store build."
          } >> "$GITHUB_STEP_SUMMARY"

  relay:
    name: relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/relay/go.mod
          cache: true
          cache-dependency-path: tools/relay/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # relayTest 会先 go build 出真实网关，再在回环上跑 Kotlin→网关→隧道全链路。
      - name: Relay integration test
        run: ./gradlew :core:relayTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-test-results
          path: |
            core/build/test-results/relayTest
            core/build/reports/tests/relayTest
          retention-days: 7
          if-no-files-found: ignore
