name: Update snapshots

# 手动触发(手机上:Actions → Update snapshots → Run workflow)。
# 在 CI 里按 core/build.gradle.kts 和 SystemPromptTest 写的方式重新生成金样,推到新分支 ci/update-snapshots-<run_id>,
# 不动 main,并尽量自动开一个 PR(开不成就留分支)。在 PR 的 Files changed 里确认变化是有意的再合并;
# 不是有意的,说明代码改动有问题,别合。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Regenerate loop and prompt-surface snapshots
        continue-on-error: true
        run: ./gradlew :core:test --tests '*LoopScenarioTest' --tests '*PromptSurfaceTest' -PupdateSnapshots --stacktrace
      - name: Regenerate system prompt goldens
        continue-on-error: true
        env:
          UPDATE_GOLDEN: "1"
        run: ./gradlew :core:test --tests '*SystemPromptAssemblyTest.goldenPerCapabilityCombination' --stacktrace
      - name: Commit changes to a new branch
        id: commit
        run: |
          git add core/src/test/resources
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="ci/update-snapshots-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Regenerate core snapshots"
          git push origin "$branch"
          git diff --stat HEAD~1 HEAD > "$RUNNER_TEMP/stat.txt"
          {
            echo "Pushed branch \`$branch\`."
            echo
            echo '```'
            cat "$RUNNER_TEMP/stat.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Regenerate core snapshots" \
            --body "Generated by the Update snapshots workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Open Files changed. Merge only if every changed line is prompt or tool-description text. If lines starting with call, assistant or result changed, do not merge."
      - name: Verify the regenerated snapshots pass
        if: steps.commit.outputs.changed == 'true'
        run: ./gradlew :core:test --stacktrace
